services:
  - type: web
    name: accesslens-api
    runtime: node
    plan: free
    rootDir: .
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @accesslens-ai/database build && pnpm --filter @accesslens-ai/api exec playwright install chromium --only-shell && pnpm --filter @accesslens-ai/api build
    startCommand: pnpm --filter @accesslens-ai/api start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: RATE_LIMIT_REDIS_URL
        sync: false
